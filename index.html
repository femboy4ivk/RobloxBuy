<!DOCTYPE html>
<html lang="ru">
<head>
    <charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxBuy - Покупка Робуксов</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            margin: 0;
        }

        .lock-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .lock-btn:hover {
            color: var(--text);
        }

        .stock-info {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--accent);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .price-display {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .price-value {
            font-weight: bold;
            color: var(--success);
            font-size: 18px;
        }

        .buy-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background: var(--accent-hover);
        }

        /* Модальное окно QR */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .qr-img {
            width: 200px;
            height: 200px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .close-btn {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .close-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>💎 RobloxBuy</h1>
            <button class="lock-btn" onclick="openAdmin()" title="Админ-панель">🔒</button>
        </div>

        <div class="stock-info">
            <span>В наличии:</span>
            <strong id="stockCount">10000</strong> робуксов
        </div>

        <div class="form-group">
            <label for="username">Ваш ник в Roblox</label>
            <input type="text" id="username" placeholder="Введите никнейм">
        </div>

        <div class="form-group">
            <label for="amount">Количество робуксов</label>
            <input type="number" id="amount" placeholder="Введите количество" min="1" oninput="calculatePrice()">
        </div>

        <div class="price-display">
            <span>К оплате:</span>
            <span class="price-value" id="totalPrice">0 ₽</span>
        </div>

        <button class="buy-btn" onclick="checkout()">Купить</button>
    </div>

    <!-- Модальное окно оплаты по QR -->
    <div class="modal" id="qrModal">
        <div class="modal-content">
            <h3>Оплата по СБП (QR)</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 15px;">Отсканируйте QR-код в приложении вашего банка</p>
            <img id="qrImage" class="qr-img" src="" alt="QR Код">
            <p id="qrAmountText" style="font-weight: bold; margin-bottom: 15px;"></p>
            <button class="close-btn" onclick="confirmPayment()">Я оплатил</button>
        </div>
    </div>

    <script>
        const RATE = 0.70; // 1 Робукс = 0.70 ₽
        
        // Получение или инициализация склада
        function getStock() {
            let stock = localStorage.getItem('roblox_stock');
            if (stock === null) {
                stock = 10000;
                localStorage.setItem('roblox_stock', stock);
            }
            return parseInt(stock);
        }

        function updateStockDisplay() {
            document.getElementById('stockCount').innerText = getStock();
        }

        function calculatePrice() {
            const amount = parseInt(document.getElementById('amount').value) || 0;
            const stock = getStock();
            
            if (amount > stock) {
                document.getElementById('amount').value = stock;
            }
            
            const currentAmount = parseInt(document.getElementById('amount').value) || 0;
            const total = (currentAmount * RATE).toFixed(2);
            document.getElementById('totalPrice').innerText = total + ' ₽';
        }

        function openAdmin() {
            const pass = prompt('Введите пароль администратора:');
            if (pass === '12345') {
                const newStock = prompt('Введите новый остаток робуксов на складе:', getStock());
                if (newStock !== null && !isNaN(newStock)) {
                    localStorage.setItem('roblox_stock', parseInt(newStock));
                    updateStockDisplay();
                    alert('Склад успешно обновлен!');
                }
            } else if (pass !== null) {
                alert('Неверный пароль!');
            }
        }

        let currentOrderData = {};

        function checkout() {
            const username = document.getElementById('username').value.trim();
            const amount = parseInt(document.getElementById('amount').value);
            const stock = getStock();

            if (!username) {
                alert('Пожалуйста, введите ваш ник в Roblox!');
                return;
            }
            if (!amount || amount <= 0) {
                alert('Введите корректное количество робуксов!');
                return;
            }
            if (amount > stock) {
                alert('В наличии нет такого количества робуксов!');
                return;
            }

            const price = (amount * RATE).toFixed(2);
            currentOrderData = { username, amount, price };

            // Генерация QR-кода СБП через официальный сервис НСПК (qr.nspk.ru)
            // Здесь используется универсальная ссылка-заглушка СБП под ваш платеж
            const sbpPayload = `https://qr.nspk.ru/AD10000G5J9V3K2R3L8N6O7P4Q1S0T9U?sum=${price}&cur=RUB`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(sbpPayload)}`;

            document.getElementById('qrImage').src = qrApiUrl;
            document.getElementById('qrAmountText').innerText = `Сумма: ${price} ₽`;
            document.getElementById('qrModal').style.display = 'flex';
        }

        function confirmPayment() {
            // Отправка данных на локальный сервер Python-бота
            fetch('http://localhost:8080/order', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(currentOrderData)
            })
            .then(response => {
                if (response.ok) {
                    alert('Заказ успешно создан и отправлен администратору!');
                } else {
                    alert('Заказ оформлен, но бот не запущен локально.');
                }
            })
            .catch(() => {
                alert('Заказ оформлен! Убедитесь, что бот (python bot.py) запущен на компьютере.');
            });

            // Уменьшаем склад локально
            const stock = getStock();
            const newStock = stock - currentOrderData.amount;
            localStorage.setItem('roblox_stock', newStock > 0 ? newStock : 0);
            
            document.getElementById('qrModal').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('totalPrice').innerText = '0 ₽';
            updateStockDisplay();
        }

        // Инициализация при загрузке страницы
        updateStockDisplay();
    </script>
</body>
</html>
