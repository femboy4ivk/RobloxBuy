<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxBuy - Оплата заказа</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h2 {
            margin-bottom: 10px;
            color: #4CAF50;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .qr-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .qr-box img {
            width: 200px;
            height: 200px;
            display: block;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn-work {
            background-color: #ff9800;
        }
        .btn-work:hover {
            background-color: #e68900;
        }
        .btn-ready {
            background-color: #2196F3;
        }
        .btn-ready:hover {
            background-color: #0b7dda;
        }
        .hidden {
            display: none;
        }
        .status-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        #error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="app">
        <!-- Шаг 1: Ввод имени, QR-код и кнопка оплаты -->
        <div id="step-qr">
            <h2>Оплата по QR-коду</h2>
            <p>Укажите ваши данные и отсканируйте QR-код</p>
            
            <div class="input-group">
                <label for="clientName">Имя покупателя (как в банке):</label>
                <input type="text" id="clientName" placeholder="Например: Иван Иванов">
            </div>
            
            <div id="error-msg">Пожалуйста, введите ваше имя!</div>

            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://yourapi-or-payment-link.ru" alt="QR Код">
            </div>

            <button class="btn" onclick="userPaid()">Я оплатил</button>
        </div>

        <!-- Шаг 2: Ожидание оплаты -->
        <div id="step-waiting" class="hidden">
            <div class="status-icon">⏳</div>
            <h2>Ждем оплату...</h2>
            <p id="waiting-text">Проверяем платеж от покупателя...</p>
            
            <button class="btn btn-work" onclick="setStatus('work')">В работе</button>
            <button class="btn btn-ready" onclick="setStatus('ready')">Готов</button>
        </div>

        <!-- Шаг 3: Заказ в работе -->
        <div id="step-work" class="hidden">
            <div class="status-icon">⚙️</div>
            <h2>Заказ в работе</h2>
            <p>Мы занимаемся выполнением вашего заказа.</p>
            <button class="btn btn-ready" onclick="setStatus('ready')">Готов</button>
        </div>

        <!-- Шаг 4: Заказ готов -->
        <div id="step-ready" class="hidden">
            <div class="status-icon">✅</div>
            <h2>Готово!</h2>
            <p>Ваш заказ выполнили. Спасибо за покупку!</p>
        </div>
    </div>

    <script>
        let savedClientName = "";

        function sendWebhook(statusName) {
            const webhookUrl = "ВАШ_ВЕБХУК_ССЫЛКА_СЮДА"; // Ссылка на ваш вебхук (при необходимости)
            
            const message = `Покупатель: ${savedClientName} | Статус: ${statusName}`;
            console.log("Отправка в вебхук: " + message);
            
            /*
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: message })
            });
            */
        }

        function userPaid() {
            const nameInput = document.getElementById('clientName');
            const errorMsg = document.getElementById('error-msg');
            
            if (nameInput.value.trim() === "") {
                errorMsg.style.display = "block";
                return;
            }
            
            errorMsg.style.display = "none";
            savedClientName = nameInput.value.trim();

            // Меняем текст ожидания, выводя имя покупателя
            document.getElementById('waiting-text').innerText = `Проверяем платеж от: ${savedClientName}`;

            document.getElementById('step-qr').classList.add('hidden');
            document.getElementById('step-waiting').classList.remove('hidden');
            
            sendWebhook("Ожидает подтверждения оплаты");
        }

        function setStatus(status) {
            document.getElementById('step-waiting').classList.add('hidden');
            document.getElementById('step-work').classList.add('hidden');
            document.getElementById('step-ready').classList.add('hidden');

            if (status === 'work') {
                document.getElementById('step-work').classList.remove('hidden');
                sendWebhook("Заказ в работе");
            } else if (status === 'ready') {
                document.getElementById('step-ready').classList.remove('hidden');
                sendWebhook("Заказ готов");
            }
        }
    </script>

</body>
</html>
